<h1>Remove the open-source Polono driver</h1>
<p>This removes the driver. Any printer the installer switched over goes back to the driver it had before.</p>
<p>Polono's own drivers only work on Apple Silicon Macs while Rosetta is installed. After macOS Golden Gate (27), they may stop working altogether.</p>
